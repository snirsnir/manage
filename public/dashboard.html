<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>דאשבורד | טכנושף</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dashboard-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; padding: 28px 0 20px;
    }
    .dashboard-title { font-size: 1.5rem; font-weight: 800; }
    .live-clock { font-family: var(--font-display); font-size: 1.5rem; color: var(--cyan);
                  text-shadow: 0 0 12px rgba(0,229,255,.4); }

    /* Summary bar */
    .summary-bar {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .summary-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: var(--r-md); padding: 10px 18px;
      font-size: .875rem; font-weight: 600;
    }
    .summary-chip .count { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }

    /* Station cards grid */
    .stations-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 16px; }

    .dash-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: var(--r-lg); overflow: hidden;
      transition: border-color .25s, transform .2s;
      position: relative;
    }
    .dash-card:hover { border-color: var(--glass-border-hover); transform: translateY(-2px); }

    .dash-card__top {
      padding: 18px 18px 14px;
    }
    .dash-card__header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .dash-card__name   { font-size: 1.05rem; font-weight: 800; color: var(--text-100); }
    .dash-card__topic  { font-size: .78rem; color: var(--text-400); margin-top:2px; }

    .dash-card__timer-row { display:flex; align-items:baseline; gap:10px; margin:8px 0; }
    .dash-card__timer     { font-family:var(--font-display); font-size:2rem; font-weight:700; }
    .dash-card__timer-label { font-size:.75rem; color:var(--text-400); }

    .dash-card__next    { font-size:.8rem; color:var(--text-300); margin-bottom:10px; }
    .dash-card__next strong { color:var(--text-100); }

    .dash-card__delay {
      font-size: .72rem; padding: 2px 10px; border-radius: 100px;
      background: rgba(244,67,54,.12); color: var(--closed); border: 1px solid rgba(244,67,54,.25);
      display: inline-block; margin-bottom: 8px;
    }
    .dash-card__delay.ok { background:rgba(0,230,118,.1);color:var(--boarding);border-color:rgba(0,230,118,.25); }

    .dash-card__progress { margin-bottom:0; }

    .dash-card__actions {
      background: rgba(0,0,0,.18); border-top: 1px solid var(--glass-border);
      padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .dash-card__actions .btn { font-size: .72rem; padding: 5px 12px; border-radius: var(--r-sm); }

    /* Manager message panel */
    .msg-overlay {
      background: rgba(255,193,7,.08); border: 1px solid rgba(255,193,7,.3);
      padding: 8px 14px; font-size: .8rem; color: #ffe082;
      border-top: 1px solid rgba(255,193,7,.2); display:flex;align-items:center;gap:8px;
    }
    .msg-overlay .clear-msg { cursor:pointer;margin-right:auto;color:var(--text-400);font-size:.75rem; }

    /* Manager message modal */
    .msg-modal-station { font-weight:700;color:var(--cyan);margin-bottom:8px; }

    /* Status colors */
    .color-idle     { color: var(--idle);     }
    .color-boarding { color: var(--boarding); }
    .color-running  { color: var(--running);  }
    .color-setup    { color: var(--setup);    }
    .color-closed   { color: var(--closed);   }

    /* Top highlight bar per status */
    .dash-card.status-idle::before     { content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--idle); }
    .dash-card.status-boarding::before { content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--boarding);box-shadow:0 0 10px var(--boarding); }
    .dash-card.status-running::before  { content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--running); box-shadow:0 0 10px var(--running);  }
    .dash-card.status-setup::before    { content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--setup);   box-shadow:0 0 10px var(--setup);    }
    .dash-card.status-closed::before   { content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--closed);  box-shadow:0 0 10px var(--closed);   }
  </style>
</head>
<body>
<div id="offline-banner">אין חיבור לאינטרנט</div>

<nav class="navbar">
  <a href="index.html" class="navbar__brand">
    <img src="logo.png" alt="טכנודע" class="navbar__logo">
    <div><div class="navbar__title">טכנושף</div><div class="navbar__subtitle">מרכז שליטה</div></div>
  </a>
  <div class="navbar__nav">
    <a href="dashboard.html" class="nav-link active">דאשבורד</a>
    <a href="board.html"     class="nav-link">לוח מרכזי</a>
    <a href="admin.html"     class="nav-link">ניהול</a>
  </div>
</nav>

<div class="page-content">
<div class="container--wide" style="padding:0 24px 60px;">

  <div class="dashboard-header">
    <div>
      <h1 class="dashboard-title">🎛️ חדר בקרה</h1>
      <p class="text-muted text-small">עדכון בזמן אמת · לחץ על מתחם לשליטה מרחוק</p>
    </div>
    <div id="live-clock" class="live-clock">00:00:00</div>
  </div>

  <!-- Summary chips -->
  <div class="summary-bar" id="summary-bar">
    <div class="summary-chip"><span class="count" id="cnt-running" style="color:var(--running)">-</span> בפעילות</div>
    <div class="summary-chip"><span class="count" id="cnt-boarding" style="color:var(--boarding)">-</span> קליטת קהל</div>
    <div class="summary-chip"><span class="count" id="cnt-setup" style="color:var(--setup)">-</span> התארגנות</div>
    <div class="summary-chip"><span class="count" id="cnt-closed" style="color:var(--closed)">-</span> סגורים</div>
    <div class="summary-chip"><span class="count" id="cnt-idle" style="color:var(--idle)">-</span> המתנה</div>
  </div>

  <div class="stations-grid" id="stations-grid">
    <div class="loading"><div class="spinner"></div><span>טוען מתחמים...</span></div>
  </div>
</div>
</div>

<!-- Modal for manager message -->
<div id="msg-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal__title">📢 שלח הודעה למתחם</div>
    <div class="msg-modal-station" id="msg-modal-station">—</div>
    <div class="form-group">
      <label class="form-label">טקסט להודעה</label>
      <input class="form-input" id="msg-input" placeholder="לדוגמה: קצרו הכנות, יש לחץ בחוץ" maxlength="80">
    </div>
    <div class="modal__footer">
      <button class="btn btn--primary" id="msg-send">שלח הודעה</button>
      <button class="btn btn--ghost"   id="msg-cancel">ביטול</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script>
initOfflineDetector();

let stations = {};
let timers   = {};

// ── Live clock ──
function tickClock() {
  document.getElementById('live-clock').textContent =
    new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock, 1000); tickClock();

// ── Load stations ──
stationsRef().on('value', snap => {
  stations = {};
  snap.forEach(c => { const v = c.val(); stations[v.id] = v; });
  renderGrid();
  updateSummary();
});

function updateSummary() {
  const counts = { idle:0, boarding:0, running:0, setup:0, closed:0 };
  Object.values(stations).forEach(s => { counts[s.status||'idle']++; });
  Object.entries(counts).forEach(([k,v]) => {
    const el = document.getElementById(`cnt-${k}`);
    if (el) el.textContent = v;
  });
}

function renderGrid() {
  const grid = document.getElementById('stations-grid');
  const list = Object.values(stations).filter(s => s.enabled!==false).sort((a,b)=>a.order-b.order);
  if (!list.length) {
    grid.innerHTML = '<div class="alert alert--info">אין מתחמים פעילים. <a href="admin.html">הוסף מתחם</a></div>';
    return;
  }
  // Clear interval timers
  Object.values(timers).forEach(clearInterval);
  timers = {};

  grid.innerHTML = list.map(s => buildCardHTML(s)).join('');
  list.forEach(s => startCardTimer(s));
}

function buildCardHTML(s) {
  const st = s.status || 'idle';
  const statusMeta = STATUS[st];
  const color = STATUS_COLORS[st];

  const hasMsg = s.managerMessage && s.managerMessage.trim();

  return `<div class="dash-card status-${st}" id="card-${s.id}">
    <div class="dash-card__top">
      <div class="dash-card__header">
        <div>
          <div class="dash-card__name">${s.name}</div>
          <div class="dash-card__topic" style="color:${s.topicColor||'var(--cyan)'}">${s.topic||''}</div>
        </div>
        <span class="badge badge--${st}"><span class="badge-dot"></span>${statusMeta.label}</span>
      </div>

      <div class="dash-card__timer-row">
        <span class="dash-card__timer color-${st}" id="timer-${s.id}">--:--</span>
        <span class="dash-card__timer-label" id="timer-label-${s.id}"></span>
      </div>

      <div class="dash-card__progress">
        <div class="progress"><div class="progress__fill progress__fill--${st}" id="prog-${s.id}" style="width:0%"></div></div>
      </div>

      <div class="dash-card__next mt-8" id="next-${s.id}"></div>
      <div id="delay-${s.id}"></div>
    </div>

    ${hasMsg ? `<div class="msg-overlay">
      <span>📢 ${s.managerMessage}</span>
      <span class="clear-msg" onclick="clearMsg('${s.id}')">✕ נקה</span>
    </div>` : ''}

    <div class="dash-card__actions">
      <button class="btn btn--success"  onclick="managerTransition('${s.id}','running')"  title="פעילות מתקיימת">🟢 פעילות מתקיימת</button>
      <button class="btn btn--warning"  onclick="managerTransition('${s.id}','setup')"    title="הכנה">🟡 הכנה</button>
      <button class="btn btn--primary"  onclick="managerTransition('${s.id}','boarding')" title="קליטה">🔵 קליטה</button>
      <button class="btn btn--ghost btn--sm" onclick="addTime('${s.id}', 3)"   title="+3 דקות">+3'</button>
      <button class="btn btn--ghost btn--sm" onclick="addTime('${s.id}', 5)"   title="+5 דקות">+5'</button>
      <button class="btn btn--ghost btn--sm" onclick="addTime('${s.id}', 7)"   title="+7 דקות">+7'</button>
      <button class="btn btn--ghost btn--sm" onclick="addTime('${s.id}', 10)"  title="+10 דקות">+10'</button>
      <button class="btn btn--secondary btn--sm" onclick="openMsgModal('${s.id}')">📢</button>
      <button class="btn btn--danger btn--sm"    onclick="managerTransition('${s.id}','closed')">🔴</button>
    </div>
  </div>`;
}

function startCardTimer(s) {
  timers[s.id] = setInterval(() => tickCard(s.id), 1000);
  tickCard(s.id);
}

function tickCard(id) {
  const s = stations[id];
  if (!s) return;
  const st = s.status || 'idle';
  const timerEl  = document.getElementById(`timer-${id}`);
  const labelEl  = document.getElementById(`timer-label-${id}`);
  const progEl   = document.getElementById(`prog-${id}`);
  const nextEl   = document.getElementById(`next-${id}`);
  const delayEl  = document.getElementById(`delay-${id}`);
  if (!timerEl) return;

  const now = Date.now();
  let secs = 0, pct = 0;

  if (st === 'running' && s.sessionEndTime) {
    secs = Math.max(0, Math.round((s.sessionEndTime - now) / 1000));
    const total = (s.activityDuration||25)*60;
    const elapsed = total - secs;
    pct = Math.min(100, Math.round(elapsed / total * 100));
    labelEl.textContent = 'נותר';
    if (nextEl) nextEl.innerHTML = s.nextSessionTime
      ? `סבב הבא: <strong>${formatTime(s.nextSessionTime)}</strong> <span style="color:var(--text-400)">${formatTimeUntil(s.nextSessionTime)}</span>`
      : '';
    if (secs === 0) timerEl.className = 'dash-card__timer color-closed';
    else timerEl.className = `dash-card__timer color-${st}`;

  } else if (st === 'boarding' && s.boardingEndTime) {
    secs = Math.max(0, Math.round((s.boardingEndTime - now) / 1000));
    const total = (s.boardingDuration||5)*60;
    pct = Math.min(100, Math.round((total - secs) / total * 100));
    labelEl.textContent = 'לפתיחה';

  } else if (st === 'setup' && s.setupEndTime) {
    secs = Math.max(0, Math.round((s.setupEndTime - now) / 1000));
    const total = (s.setupDuration||7)*60;
    pct = Math.min(100, Math.round((total - secs) / total * 100));
    labelEl.textContent = 'להכנה';

  } else {
    timerEl.textContent = '--:--';
    if (labelEl) labelEl.textContent = '';
    if (nextEl) nextEl.innerHTML = '';
    return;
  }

  timerEl.textContent = formatTimer(secs);
  if (progEl) progEl.style.width = pct + '%';

  // Delay indicator
  if (delayEl && st === 'running' && s.sessionStartTime && s.scheduledStartTime) {
    const delay = Math.round((s.sessionStartTime - s.scheduledStartTime) / 60000);
    if (delay > 1) {
      delayEl.innerHTML = `<span class="dash-card__delay">⏰ איחור: +${delay} דק'</span>`;
    } else {
      delayEl.innerHTML = `<span class="dash-card__delay ok">✓ בזמן</span>`;
    }
  } else if (delayEl) {
    delayEl.innerHTML = '';
  }
}

// ── Manager actions ──
async function managerTransition(id, newStatus) {
  const s = stations[id];
  if (!s) return;
  try {
    await transitionStation(id, newStatus, s, { triggeredBy: 'manager' });
    showToast(`${s.name}: ${STATUS[newStatus].label}`, 'success');
  } catch(e) {
    showToast('שגיאה', 'error');
  }
}

async function addTime(id, mins) {
  const s = stations[id];
  if (!s || s.status !== 'running') { showToast('המתחם לא בפעילות', 'warning'); return; }
  await extendSession(id, s, mins);
  showToast(`הוספו ${mins} דקות ל-${s.name}`, 'success');
}

async function clearMsg(id) {
  await stationRef(id).update({ managerMessage: '' });
  showToast('הודעה נמחקה', 'success');
}

// ── Manager message modal ──
let msgTargetId = null;
function openMsgModal(id) {
  msgTargetId = id;
  const s = stations[id];
  document.getElementById('msg-modal-station').textContent = s ? s.name : id;
  document.getElementById('msg-input').value = s?.managerMessage || '';
  document.getElementById('msg-modal').classList.remove('hidden');
  document.getElementById('msg-input').focus();
}
document.getElementById('msg-cancel').onclick = () => document.getElementById('msg-modal').classList.add('hidden');
document.getElementById('msg-send').onclick = async () => {
  if (!msgTargetId) return;
  const msg = document.getElementById('msg-input').value.trim();
  await stationRef(msgTargetId).update({ managerMessage: msg, lastUpdated: Date.now() });
  document.getElementById('msg-modal').classList.add('hidden');
  showToast('הודעה נשלחה!', 'success');
};
// Close modal on overlay click
document.getElementById('msg-modal').onclick = function(e) {
  if (e.target === this) this.classList.add('hidden');
};
</script>
</body>
</html>
