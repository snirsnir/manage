<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>לוח מרכזי | טכנושף</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { cursor: none; }
    body { background: var(--bg-0); overflow: hidden; }
    html, body { height: 100dvh; }

    .board-layout {
      height: 100dvh;
      display: flex; flex-direction: column;
      padding: 28px 48px;
      gap: 20px;
    }

    /* Header */
    .board-header {
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .board-brand { display:flex;align-items:center;gap:20px; }
    .board-logo  { height:56px; filter:drop-shadow(0 0 16px rgba(0,229,255,.4)); }
    .board-title { font-size:2rem;font-weight:900;
      background:linear-gradient(135deg,var(--cyan),var(--violet-light));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .board-subtitle { font-size:.9rem;color:var(--text-400); }
    .board-clock { font-family:var(--font-display);font-size:3rem;font-weight:700;
                   color:var(--cyan);text-shadow:0 0 16px rgba(0,229,255,.4);letter-spacing:4px; }

    /* Divider */
    .board-divider {
      height:2px;
      background:linear-gradient(90deg,transparent,var(--cyan),var(--violet-light),transparent);
      flex-shrink:0;
    }

    /* Column headers */
    .board-col-headers {
      display:grid;flex-shrink:0;
      font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:var(--text-400);padding:0 8px;
    }

    /* Rows */
    .board-rows { flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px; }

    .board-row {
      display:grid;align-items:center;
      background:var(--glass);border:1px solid var(--glass-border);
      border-radius:var(--r-lg);padding:14px 20px;
      transition:border-color .3s,background .3s;
      position:relative;overflow:hidden;
    }
    .board-row::before {
      content:'';position:absolute;top:0;right:0;bottom:0;width:4px;
      border-radius:0 var(--r-lg) var(--r-lg) 0;
      transition:background .4s;
    }
    .board-row.status-idle::before     { background:var(--idle); }
    .board-row.status-boarding::before { background:var(--boarding);box-shadow:0 0 10px var(--boarding); }
    .board-row.status-running::before  { background:var(--running); box-shadow:0 0 10px var(--running);  }
    .board-row.status-setup::before    { background:var(--setup);   box-shadow:0 0 10px var(--setup);    }
    .board-row.status-closed::before   { background:var(--closed);  }

    .board-row.status-boarding { border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.05); }
    .board-row.status-running  { border-color:rgba(33,150,243,.3); }

    .col-name    { }
    .col-topic   { }
    .col-status  { }
    .col-time    { font-family:var(--font-display); }
    .col-next    { }

    .row-name   { font-size:1.3rem;font-weight:800;color:var(--text-100); }
    .row-topic  { font-size:.85rem;font-weight:600; }
    .row-status { }
    .row-time   { font-family:var(--font-display);font-size:1.6rem;font-weight:700; }
    .row-next   { font-size:1rem;color:var(--text-300); }
    .row-next strong { color:var(--text-100); }

    /* "coming soon" highlight for next session */
    .next-soon { color:var(--boarding) !important; font-weight:700; animation:blink 1.5s step-start infinite; }

    /* Footer */
    .board-footer {
      flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
      color:var(--text-400); font-size:.8rem;
    }

    /* No stations */
    .board-empty { flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-400);font-size:1.5rem; }
  </style>
</head>
<body>
<div class="page-content">
<div class="board-layout">

  <!-- Header -->
  <div class="board-header">
    <div class="board-brand">
      <img src="logo.png" class="board-logo" alt="טכנודע">
      <div>
        <div class="board-title">טכנושף</div>
        <div class="board-subtitle">לוח פעילויות — כל הנושאים</div>
      </div>
    </div>
    <div id="board-clock" class="board-clock">--:--:--</div>
  </div>

  <div class="board-divider"></div>

  <!-- Column headers -->
  <div class="board-col-headers" id="col-headers" style="grid-template-columns:2fr 2.5fr 1.5fr 1.5fr 2fr;padding-right:26px;">
    <span>מתחם</span>
    <span>נושא</span>
    <span>מצב</span>
    <span>טיימר</span>
    <span>סבב הבא</span>
  </div>

  <!-- Rows -->
  <div class="board-rows" id="board-rows">
    <div class="loading"><div class="spinner"></div><span style="color:var(--text-300)">טוען...</span></div>
  </div>

  <!-- Footer -->
  <div class="board-footer">
    <span>מצב מסך ✓ עדכון בזמן אמת</span>
    <span id="board-offline" style="color:var(--closed);display:none;">⚠️ ללא חיבור</span>
    <span>טכנודע © כל הזכויות שמורות</span>
  </div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script>
let stations   = {};
let timerInt   = null;

// Clock
setInterval(() => {
  document.getElementById('board-clock').textContent =
    new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// Offline
window.addEventListener('offline', () => document.getElementById('board-offline').style.display = 'block');
window.addEventListener('online',  () => document.getElementById('board-offline').style.display = 'none');

// Firebase
stationsRef().on('value', snap => {
  stations = {};
  snap.forEach(c => { const v = c.val(); if (v.enabled !== false) stations[v.id] = v; });
  renderBoard();
  clearInterval(timerInt);
  timerInt = setInterval(tickBoard, 1000);
});

function getSortedStations() {
  return Object.values(stations).sort((a, b) => {
    // Sort: active first (boarding > running > setup > idle > closed), then by next session time
    const priority = { boarding:0, running:1, setup:2, idle:3, closed:4 };
    const pa = priority[a.status||'idle'] ?? 3;
    const pb = priority[b.status||'idle'] ?? 3;
    if (pa !== pb) return pa - pb;
    const na = a.nextSessionTime || 9e15;
    const nb = b.nextSessionTime || 9e15;
    return na - nb;
  });
}

function renderBoard() {
  const rows = document.getElementById('board-rows');
  const list = getSortedStations();

  if (!list.length) {
    rows.innerHTML = '<div class="board-empty">אין מתחמים פעילים</div>';
    return;
  }

  rows.innerHTML = list.map(s => buildRow(s)).join('');
}

function buildRow(s) {
  const st    = s.status || 'idle';
  const color = s.topicColor || 'var(--cyan)';

  let timerHtml = '<span class="row-time" style="color:var(--text-400)">—</span>';
  let nextHtml  = '<span class="row-next" style="color:var(--text-400)">—</span>';

  const now = Date.now();

  if (st === 'running' && s.sessionEndTime) {
    const secs = Math.max(0, Math.round((s.sessionEndTime - now)/1000));
    const color = secs < 180 ? 'var(--closed)' : secs < 300 ? 'var(--setup)' : 'var(--running)';
    timerHtml = `<span class="row-time" id="t-${s.id}" style="color:${color}">${formatTimer(secs)}</span>`;
  } else if (st === 'boarding' && s.boardingEndTime) {
    const secs = Math.max(0, Math.round((s.boardingEndTime - now)/1000));
    timerHtml = `<span class="row-time" id="t-${s.id}" style="color:var(--boarding)">${formatTimer(secs)}</span>`;
  } else if (st === 'setup' && s.setupEndTime) {
    const secs = Math.max(0, Math.round((s.setupEndTime - now)/1000));
    timerHtml = `<span class="row-time" id="t-${s.id}" style="color:var(--setup)">${formatTimer(secs)}</span>`;
  }

  if (s.nextSessionTime) {
    const minsUntil = Math.round((s.nextSessionTime - now)/60000);
    const isSoon    = minsUntil <= 5 && minsUntil >= 0;
    nextHtml = `<span class="row-next ${isSoon?'next-soon':''}" id="n-${s.id}">
      <strong>${formatTime(s.nextSessionTime)}</strong>
      <span style="font-size:.85rem;color:${isSoon?'var(--boarding)':'var(--text-400)'}">
        ${formatTimeUntil(s.nextSessionTime)}
      </span>
    </span>`;
  }

  return `<div class="board-row status-${st}" id="row-${s.id}"
    style="grid-template-columns:2fr 2.5fr 1.5fr 1.5fr 2fr;">
    <div class="row-name">${s.name}</div>
    <div class="row-topic" style="color:${color}">${s.topic||'—'}</div>
    <div>${statusBadge(st)}</div>
    <div>${timerHtml}</div>
    <div>${nextHtml}</div>
  </div>`;
}

function statusBadge(st) {
  return `<span class="badge badge--${st}"><span class="badge-dot"></span>${STATUS[st].label}</span>`;
}

function tickBoard() {
  const now  = Date.now();
  const list = getSortedStations();

  list.forEach(s => {
    const st  = s.status || 'idle';
    const tEl = document.getElementById(`t-${s.id}`);
    const nEl = document.getElementById(`n-${s.id}`);

    if (tEl) {
      let secs = 0;
      if (st === 'running'  && s.sessionEndTime)  secs = Math.max(0, Math.round((s.sessionEndTime  - now)/1000));
      if (st === 'boarding' && s.boardingEndTime)  secs = Math.max(0, Math.round((s.boardingEndTime - now)/1000));
      if (st === 'setup'    && s.setupEndTime)     secs = Math.max(0, Math.round((s.setupEndTime    - now)/1000));
      tEl.textContent = formatTimer(secs);
      if (st === 'running' && secs < 180) tEl.style.color = secs < 60 ? 'var(--closed)' : 'var(--setup)';
    }

    if (nEl && s.nextSessionTime) {
      const minsUntil = Math.round((s.nextSessionTime - now)/60000);
      const isSoon    = minsUntil <= 5 && minsUntil >= 0;
      nEl.innerHTML = `
        <strong>${formatTime(s.nextSessionTime)}</strong>
        <span style="font-size:.85rem;color:${isSoon?'var(--boarding)':'var(--text-400)'}">
          ${formatTimeUntil(s.nextSessionTime)}
        </span>`;
      nEl.className = `row-next ${isSoon?'next-soon':''}`;
    }
  });
}
</script>
</body>
</html>
