<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>מדריך | טכנושף</title>
  <link rel="stylesheet" href="css/style.css?v=20260824">
  <script>(function(){var t=localStorage.getItem('tcTheme'),a=localStorage.getItem('tcAccent');if(t==='light')document.documentElement.setAttribute('data-theme','light');if(a&&a!=='cyan')document.documentElement.setAttribute('data-accent',a);})();</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#03031a">
  <style>
    body { overflow: hidden; }

    .remote-layout {
      display: flex; flex-direction: column;
      height: 100dvh; max-height: 100dvh;
      padding: 16px;
      gap: 12px;
    }

    /* Top bar */
    .remote-topbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .remote-brand { display:flex;align-items:center;gap:10px; }
    .remote-brand img { height:32px;filter:drop-shadow(0 0 8px rgba(240,180,41,.4)); }
    .remote-brand .brand-name { font-size:.85rem;font-weight:700;color:var(--cyan); }
    #remote-clock { font-family:var(--font-display);font-size:1rem;color:var(--text-300); }

    /* Station info */
    .station-info {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: var(--r-lg); padding: 16px 20px;
      flex-shrink: 0;
    }
    .station-info .station-name  { font-size:1.4rem;font-weight:800;color:var(--text-100); }
    .station-info .station-topic { font-size:.85rem;margin-top:2px; }
    .station-info .badge         { margin-top:10px; }

    /* Timer section */
    .timer-section {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: var(--r-lg); padding: 20px;
      text-align: center; flex-shrink: 0;
    }
    .timer-label {
      font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:var(--text-400);margin-bottom:8px;
      min-height: 1.4em; /* מונע קפיצת גובה כשהטקסט משתנה */
    }
    #main-timer {
      font-size: 4.5rem;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums; /* כל ספרה באותה רוחב */
      font-feature-settings: "tnum";
      display: block;
      width: 100%;
      text-align: center;
      min-height: 1.2em; /* מונע קפיצת גובה */
    }
    .timer-sub   { font-size:.8rem;color:var(--text-300);margin-top:8px;min-height:1.3em; }
    #progress-wrap { margin-top:12px; }

    /* Main action button */
    .main-action { flex-shrink: 0; }
    #btn-main {
      width:100%; min-height:90px; font-size:1.6rem; border-radius:var(--r-xl);
      letter-spacing:.02em;
    }

    /* Time extension row */
    .extend-row {
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .extend-row .btn { flex: 1; font-size:1rem; padding:14px 0; }

    /* Next session info */
    .next-info {
      background: rgba(33,150,243,.08); border: 1px solid rgba(33,150,243,.2);
      border-radius: var(--r-md); padding: 12px 18px;
      font-size:.85rem; color:var(--text-300); text-align:center; flex-shrink:0;
    }
    .next-info strong { color:var(--text-100); font-size:1rem; }

    /* Manager message banner */
    #manager-msg-bar {
      background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.3);
      border-radius:var(--r-md);padding:10px 16px;
      font-size:.85rem;color:#ffe082;flex-shrink:0;display:none;
    }

    /* Instructor name slot */
    .station-info { cursor: pointer; }
    .instructor-slot {
      margin-top: 12px; padding: 8px 12px;
      background: rgba(255,255,255,.04);
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: var(--r-sm);
      display: flex; align-items: center; gap: 8px;
      font-size: .85rem; transition: border-color .15s, background .15s;
    }
    .station-info:hover .instructor-slot {
      background: rgba(240,180,41,.06); border-color: rgba(240,180,41,.3);
    }

    /* Instructor name modal */
    #name-modal {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(3,3,26,.88); backdrop-filter: blur(10px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .name-modal-box {
      background: var(--surface); border: 1px solid var(--glass-border);
      border-radius: var(--r-xl); padding: 32px 28px;
      width: 100%; max-width: 340px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
    }
    .name-modal-title  { font-size:1.2rem; font-weight:800; text-align:center; margin-bottom:4px; }
    .name-modal-sub    { font-size:.85rem; color:var(--text-400); text-align:center; margin-bottom:20px; }
    #name-input        { text-align:center; font-size:1.1rem; margin-bottom:16px; }

    /* Auto-cycle indicator */
    .auto-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.25);
      border-radius: 100px; padding: 5px 14px;
      font-size: .78rem; font-weight: 700; color: var(--cyan);
    }
    .auto-badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--cyan);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.5)} }

    /* Transitioning overlay */
    .transitioning-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(3,3,26,.85); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center;
    }
    .transitioning-overlay .spinner { width: 56px; height: 56px; }
    .transitioning-overlay p { color: var(--cyan); font-size: 1.1rem; font-weight: 600; }

@media(max-width:380px) {
      #main-timer { font-size:3.5rem; }
      #btn-main   { font-size:1.35rem;min-height:76px; }
    }
  </style>
</head>
<body>
<div id="offline-banner">אין חיבור לאינטרנט — עודכן לאחרונה: <span id="last-sync">?</span></div>

<div class="page-content">
<div class="remote-layout">

  <!-- Top bar -->
  <div class="remote-topbar">
    <div class="remote-brand">
      <img src="logo.png" alt="טכנודע">
      <span class="brand-name">טכנושף</span>
    </div>
    <div id="remote-clock">--:--</div>
  </div>

  <!-- Manager message -->
  <div id="manager-msg-bar">📢 <span id="manager-msg-text"></span></div>

  <!-- Station info -->
  <div class="station-info" id="station-info" onclick="openNameModal()" title="לחץ לעדכון שם מדריך">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div class="timer-label" id="timer-label">מצב</div>
    <div class="timer-display" id="main-timer" style="font-size:4.5rem;letter-spacing:4px;">--:--</div>
    <div class="timer-sub" id="timer-sub"></div>
    <div id="progress-wrap"><div class="progress"><div class="progress__fill" id="prog-fill" style="width:0%"></div></div></div>
  </div>

  <!-- כפתורי הארכה — מעל כפתור סיים -->
  <div id="extend-row" class="extend-row" style="display:none;flex-shrink:0;">
    <button class="btn btn--extend" onclick="doExtend(3)">הארך 3+</button>
    <button class="btn btn--extend" onclick="doExtend(5)">הארך 5+</button>
    <button class="btn btn--extend" onclick="doExtend(7)">הארך 7+</button>
    <button class="btn btn--extend" onclick="doExtend(10)">הארך 10+</button>
  </div>

  <!-- Main CTA button -->
  <div class="main-action">
    <button class="btn" id="btn-main" disabled>טוען...</button>
  </div>

  <!-- Auto badge + controls -->
  <div id="controls-row" style="display:none;flex-shrink:0;">
    <div style="display:flex;justify-content:center;">
      <div class="auto-badge"><div class="dot"></div>מחזור אוטומטי פעיל</div>
    </div>
  </div>

  <!-- Next session -->
  <div class="next-info" id="next-info" style="display:none;">
    הסבב הבא מתחיל ב-<strong id="next-time">--:--</strong>
    <span id="next-rel" style="color:var(--text-400);font-size:.8rem;"></span>
  </div>

  <!-- Stop cycle (shown when cycle is running) -->
  <div id="stop-row" style="display:none;flex-shrink:0;text-align:center;">
    <button class="btn btn--ghost btn--sm" onclick="doStop()" style="color:var(--closed);border-color:rgba(244,67,54,.3);">
      ⏹ עצור מחזור
    </button>
  </div>

</div>
</div>

<!-- Instructor name modal -->
<div id="name-modal">
  <div class="name-modal-box">
    <div class="name-modal-title">👤 שם המדריך</div>
    <div class="name-modal-sub" id="name-modal-sub"></div>
    <input class="form-input" id="name-input" placeholder="הכנס את שמך" maxlength="30"
           onkeydown="if(event.key==='Enter')saveInstructorName()">
    <div style="display:flex;gap:10px;">
      <button class="btn btn--primary" style="flex:1;font-size:1rem;" onclick="saveInstructorName()">💾 שמור</button>
      <button class="btn btn--ghost"   style="flex:1;font-size:1rem;" onclick="closeNameModal()">ביטול</button>
    </div>
  </div>
</div>

<!-- Transitioning overlay -->
<div id="transitioning-overlay" class="transitioning-overlay" style="display:none;">
  <div class="spinner"></div>
  <p id="transitioning-label">עובר לשלב הבא...</p>
</div>

<div id="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js?v=20260824"></script>
<script>
const stationId = getParam('station');
if (!stationId) {
  document.body.innerHTML = '<div style="padding:40px;text-align:center;"><h2>לא צוין מתחם</h2><p style="color:#94a3b8;margin-top:8px;">הוסף <code>?station=ID</code> לכתובת</p><a href="tut.html" style="color:#00e5ff;">לדף הבית</a></div>';
}

// ── מחזור אוטומטי ──
// boarding → running → setup → boarding → ...
const AUTO_NEXT = { running: 'setup', setup: 'boarding', boarding: 'running' };
const AUTO_LABELS = {
  boarding: 'מתחיל פעילות...',
  running:  'עובר להכנה...',
  setup:    'פותח קליטה...'
};

let station           = null;
let timerInterval     = null;
let lastSyncTime      = null;
let autoTransitioning = false;
let firstLoad         = true;

initOfflineDetector();

// שעון
setInterval(() => {
  document.getElementById('remote-clock').textContent =
    new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}, 1000);

// ── האזנה ל-Firebase ──
stationRef(stationId).on('value', snap => {
  station      = snap.val();
  lastSyncTime = Date.now();
  document.getElementById('last-sync').textContent = formatTime(lastSyncTime);

  if (!station) {
    document.getElementById('station-info').innerHTML = '<div style="color:var(--closed)">מתחם לא נמצא</div>';
    return;
  }

  autoTransitioning = false;
  hideTransitioningOverlay();
  renderStation();

  // בטעינה ראשונה: אם אין שם מדריך — פתח popup אוטומטית
  if (firstLoad) {
    firstLoad = false;
    if (station && !station.instructorName) {
      setTimeout(openNameModal, 500);
    }
  }
});

function renderStation() {
  if (!station) return;
  const st    = station.status || 'idle';
  const color = station.topicColor || 'var(--cyan)';
  const inCycle = ['boarding', 'running', 'setup'].includes(st);

  // כרטיס מתחם
  const instructorName = station.instructorName || '';
  document.getElementById('station-info').innerHTML = `
    <div class="station-name">${station.name}</div>
    <div class="station-topic" style="color:${color}">${station.topic || ''}</div>
    <div class="mt-8" style="display:flex;align-items:center;gap:8px;">
      <span class="badge badge--${st}"><span class="badge-dot"></span>${STATUS[st].label}</span>
    </div>
    <div class="instructor-slot">
      <span>👤</span>
      ${instructorName
        ? `<span style="font-weight:700;color:var(--text-100);">${instructorName}</span>`
        : `<span style="color:var(--text-400);">לחץ להוסיף שם מדריך</span>`}
      <span style="margin-right:auto;color:var(--text-400);font-size:.75rem;">✏️</span>
    </div>`;

  // הודעת מנהל
  const msgBar = document.getElementById('manager-msg-bar');
  if (station.managerMessage && station.managerMessage.trim()) {
    msgBar.style.display = 'block';
    document.getElementById('manager-msg-text').textContent = station.managerMessage;
  } else {
    msgBar.style.display = 'none';
  }

  // שורת כפתורים (פעיל רק במהלך מחזור)
  document.getElementById('controls-row').style.display = inCycle ? 'block' : 'none';
  document.getElementById('extend-row').style.display   = st === 'running' ? 'flex' : 'none';
  document.getElementById('stop-row').style.display     = inCycle ? 'block'  : 'none';

  // "הסבב הבא"
  const nextInfo = document.getElementById('next-info');
  if (station.nextSessionTime && inCycle) {
    nextInfo.style.display = 'block';
    document.getElementById('next-time').textContent = formatTime(station.nextSessionTime);
  } else {
    nextInfo.style.display = 'none';
  }

  // כפתור ראשי
  updateMainButton(st, inCycle);

  // טיימר
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 500);
  tickTimer();
}

function updateMainButton(st, inCycle) {
  const btn = document.getElementById('btn-main');
  btn.disabled  = false;
  btn.className = 'btn btn--xxl';

  if (st === 'idle') {
    btn.textContent = '🚀 התחל מחזור';
    btn.classList.add('btn--success');
    btn.onclick = () => doManualTransition('boarding');
    return;
  }
  if (st === 'closed') {
    btn.textContent = 'מתחם סגור';
    btn.classList.add('btn--ghost');
    btn.disabled = true;
    return;
  }
  if (st === 'break') {
    btn.textContent = '☕ בהפסקה — נחזור בקרוב';
    btn.classList.add('btn--ghost');
    btn.style.color = 'var(--break)';
    btn.disabled = true;
    return;
  }

  // boarding — מעבר ידני ישיר לפעילות (אין AUTO_NEXT לקליטה)
  if (st === 'boarding') {
    btn.textContent = '▶ התחל פעילות עכשיו';
    btn.classList.add('btn--success');
    btn.onclick = () => doManualTransition('running');
    return;
  }

  // בתוך מחזור — הכפתור מדלג לשלב הבא ידנית
  const skipLabels = {
    running: { label: '⏹ סיים פעילות',        cls: 'btn--danger'  },
    setup:   { label: '🚪 פתח קליטה עכשיו',  cls: 'btn--success' }
  };
  const a = skipLabels[st] || { label: '▶', cls: 'btn--secondary' };
  btn.textContent = a.label;
  btn.classList.add(a.cls);
  btn.onclick = () => doSkipToNext();
}

// ── Tick timer + auto-transition ──
function tickTimer() {
  if (!station) return;
  const st  = station.status || 'idle';
  const now = Date.now();

  const timerEl = document.getElementById('main-timer');
  const labelEl = document.getElementById('timer-label');
  const subEl   = document.getElementById('timer-sub');
  const progEl  = document.getElementById('prog-fill');
  const relEl   = document.getElementById('next-rel');

  if (relEl && station.nextSessionTime) {
    relEl.textContent = formatTimeUntil(station.nextSessionTime);
  }

  let secs = 0, pct = 0, label = '', sub = '', progClass = '', endTime = 0, total = 0;

  if (st === 'running' && station.sessionEndTime) {
    endTime = station.sessionEndTime;
    total   = (station.activityDuration || 25) * 60;
    secs    = Math.max(0, Math.round((endTime - now) / 1000));
    pct     = Math.min(100, Math.round(((total - secs) / total) * 100));
    label   = 'נותר לפעילות';
    sub     = `התחיל: ${formatTime(station.sessionStartTime)}`;
    progClass = 'progress__fill--running';

  } else if (st === 'boarding' && station.boardingEndTime) {
    endTime = station.boardingEndTime;
    total   = (station.boardingDuration || 3) * 60;
    secs    = Math.max(0, Math.round((endTime - now) / 1000));
    pct     = Math.min(100, Math.round(((total - secs) / total) * 100));
    label   = 'קליטת קהל';
    sub     = 'הפעילות הבאה מתחילה בקרוב...';
    progClass = 'progress__fill--setup';

  } else if (st === 'setup' && station.setupEndTime) {
    endTime = station.setupEndTime;
    total   = (station.setupDuration || 7) * 60;
    secs    = Math.max(0, Math.round((endTime - now) / 1000));
    pct     = Math.min(100, Math.round(((total - secs) / total) * 100));
    label   = 'התארגנות';
    sub     = 'הכנה לסבב הבא...';
    progClass = 'progress__fill--setup';

  } else if (st === 'break' && station.breakEndTime) {
    endTime = station.breakEndTime;
    total   = 30 * 60;
    secs    = Math.max(0, Math.round((endTime - now) / 1000));
    pct     = Math.min(100, Math.round(((total - secs) / total) * 100));
    label   = 'נחזור בעוד';
    sub     = 'הפסקה 30 דקות';
    progClass = 'progress__fill--setup';
    timerEl.textContent = formatTimer(secs);
    timerEl.className   = 'timer-display';
    timerEl.style.color = 'var(--break)';
    labelEl.textContent = label;
    labelEl.style.color = 'var(--break)';
    subEl.textContent   = sub;
    progEl.className    = `progress__fill ${progClass}`;
    progEl.style.width  = pct + '%';
    return;

  } else {
    timerEl.textContent = '--:--';
    timerEl.className   = 'timer-display';
    timerEl.style.color = '';
    labelEl.textContent = STATUS[st]?.label || '';
    labelEl.style.color = '';
    subEl.textContent   = st === 'idle' ? 'לחץ "התחל מחזור" כדי להתחיל' : '';
    progEl.style.width  = '0%';
    return;
  }

  timerEl.textContent = formatTimer(secs);
  timerEl.className   = `timer-display ${secs < 60 ? 'timer-display--danger' : secs < 180 ? 'timer-display--warn' : ''}`;
  timerEl.style.color = '';
  labelEl.textContent = label;
  labelEl.style.color    = st === 'setup' ? 'var(--setup)' : st === 'boarding' ? 'var(--boarding)' : '';
  labelEl.style.fontSize = st === 'setup' ? '1rem'         : '';
  subEl.textContent   = sub;
  progEl.className    = `progress__fill ${progClass}`;
  progEl.style.width  = pct + '%';

  // ── מעבר אוטומטי כשהטיימר מגיע ל-0 ──
  if (secs === 0 && !autoTransitioning && AUTO_NEXT[st]) {
    scheduleAutoTransition(st);
  }
}

function scheduleAutoTransition(fromStatus) {
  autoTransitioning = true;
  // 3 שניות grace — נותן למדריך לדלג ידנית אם רוצה
  setTimeout(async () => {
    if (!station) { autoTransitioning = false; return; }
    try {
      // מאמת שהסטטוס לא שונה ידנית בינתיים
      const snap    = await stationRef(stationId).once('value');
      const current = snap.val();
      if (!current || current.status !== fromStatus) {
        autoTransitioning = false;
        return;
      }
      const nextStatus = AUTO_NEXT[fromStatus];
      showTransitioningOverlay(AUTO_LABELS[fromStatus]);
      await transitionStation(stationId, nextStatus, current, { auto: true });
    } catch(e) {
      showToast('שגיאת מעבר אוטומטי: ' + e.message, 'error');
      autoTransitioning = false;
      hideTransitioningOverlay();
    }
  }, 3000);
}

function showTransitioningOverlay(msg) {
  const el = document.getElementById('transitioning-overlay');
  document.getElementById('transitioning-label').textContent = msg || 'עובר לשלב הבא...';
  el.style.display = 'flex';
}
function hideTransitioningOverlay() {
  document.getElementById('transitioning-overlay').style.display = 'none';
}

// ── פעולות ידניות ──
async function doManualTransition(newStatus) {
  if (!station) return;
  const btn = document.getElementById('btn-main');
  btn.disabled = true;
  try {
    await transitionStation(stationId, newStatus, station, { manual: true });
  } catch(e) {
    showToast('שגיאה: ' + e.message, 'error');
    btn.disabled = false;
  }
}

async function doSkipToNext() {
  if (!station || autoTransitioning) return;
  const next = AUTO_NEXT[station.status];
  if (!next) return;
  autoTransitioning = true;
  showTransitioningOverlay(AUTO_LABELS[station.status]);
  try {
    await transitionStation(stationId, next, station, { manual: true, skip: true });
  } catch(e) {
    showToast('שגיאה: ' + e.message, 'error');
    autoTransitioning = false;
    hideTransitioningOverlay();
  }
}

async function doExtend(mins) {
  if (!station || station.status !== 'running') return;
  await extendSession(stationId, station, mins);
  showToast(`הוספו ${mins} דקות`, 'success');
}

// ── Instructor name ──
function openNameModal() {
  if (!station) return;
  document.getElementById('name-modal-sub').textContent = station.name;
  document.getElementById('name-input').value = station.instructorName || '';
  document.getElementById('name-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('name-input').focus(), 60);
}

function closeNameModal() {
  document.getElementById('name-modal').style.display = 'none';
}

async function saveInstructorName() {
  const name = document.getElementById('name-input').value.trim();
  closeNameModal();
  try {
    await stationRef(stationId).update({ instructorName: name, lastUpdated: Date.now() });
    showToast(name ? `שם המדריך: ${name}` : 'שם המדריך נמחק', 'success');
  } catch(e) {
    showToast('שגיאה: ' + e.message, 'error');
  }
}

// Close name modal on backdrop click
document.getElementById('name-modal').addEventListener('click', function(e) {
  if (e.target === this) closeNameModal();
});

async function doStop() {
  if (!confirm('לעצור את המחזור ולהחזיר את המתחם להמתנה?')) return;
  autoTransitioning = false;
  hideTransitioningOverlay();
  await transitionStation(stationId, 'idle', station, { manual: true });
  showToast('המחזור נעצר', 'warning');
}
</script>
