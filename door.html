<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>הצגה בכניסה למעבדות | טכנושף</title>
  <link rel="stylesheet" href="css/style.css?v=20260824e">
  <script>(function(){var t=localStorage.getItem('tcTheme'),a=localStorage.getItem('tcAccent');if(t==='light')document.documentElement.setAttribute('data-theme','light');if(a&&a!=='cyan')document.documentElement.setAttribute('data-accent',a);})();</script>
  <style>
    body { background: var(--bg-0); }

    /* ════════════════════════════════
       SHARED STEP CHROME
    ════════════════════════════════ */
    .step-screen {
      height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; padding: 18px 16px 14px;
    }
    .step-screen.hidden { display: none; }

    .step-logo  { height: 38px; margin-bottom: 10px; filter: drop-shadow(0 0 14px rgba(240,180,41,.4)); }
    .step-title { font-size: 1.5rem; font-weight: 900; color: var(--text-100); margin-bottom: 3px; }
    .step-sub   { font-size: .82rem; color: var(--text-400); margin-bottom: 14px; text-align: center; }

    .step-bar {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--glass-border); transition: background .3s;
    }
    .step-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .step-dot.done   { background: var(--running); }

    .step-btns { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; flex-shrink: 0; }
    .step-btns .btn { padding: 14px 36px; font-size: 1rem; border-radius: var(--r-lg); }

    /* ════════════════════════════════
       STEP 1 — PICKER
    ════════════════════════════════ */
    .pick-count {
      font-size: .82rem; font-weight: 700; color: var(--cyan);
      background: rgba(240,180,41,.1); border: 1px solid rgba(240,180,41,.25);
      border-radius: 100px; padding: 3px 12px; margin-bottom: 10px; flex-shrink: 0;
    }

    /* ── Ready-made presets ── */
    .preset-heading {
      font-size: .72rem; font-weight: 700; color: var(--text-400);
      letter-spacing: .07em; align-self: flex-start; margin-bottom: 6px; flex-shrink: 0;
    }
    .preset-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px; width: 100%; margin-bottom: 14px; flex-shrink: 0;
    }
    .preset-card {
      background: rgba(240,180,41,.07);
      border: 2px solid rgba(240,180,41,.28);
      border-radius: var(--r-lg); padding: 11px 13px 9px;
      display: flex; flex-direction: column; gap: 7px;
      cursor: pointer; text-align: right;
      transition: border-color .2s, background .2s, transform .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .preset-card:hover  { border-color: var(--cyan); background: rgba(240,180,41,.13); }
    .preset-card:active { transform: scale(.97); }
    .preset-title { font-size: .9rem; font-weight: 800; color: var(--text-100); }
    .preset-labs  { display: flex; flex-direction: column; gap: 3px; font-size: .76rem; color: var(--text-300); }
    .preset-labs > span { display: flex; align-items: center; gap: 6px; }
    .preset-labs .pv { font-size: 1.05rem; color: var(--cyan); line-height: 1; }
    .preset-copy {
      font-size: .7rem; font-weight: 700; align-self: flex-start;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
      color: var(--text-300); border-radius: 100px; padding: 4px 12px; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .preset-copy:hover { background: rgba(255,255,255,.18); color: var(--text-100); }

    .disp-copy {
      position: fixed; bottom: 62px; right: 16px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.18);
      color: var(--text-300); font-size: .82rem; font-weight: 600;
      padding: 10px 18px; border-radius: 100px; cursor: pointer;
      transition: background .2s, opacity .2s; opacity: .55;
      -webkit-tap-highlight-color: transparent;
    }
    .disp-copy:hover { opacity: 1; background: rgba(0,0,0,.9); }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px; width: 100%;
      flex: 1; overflow-y: auto; align-content: start;
      padding-bottom: 4px;
    }

    .picker-card {
      background: var(--glass);
      border: 3px solid var(--glass-border);
      border-radius: var(--r-lg); padding: 20px 16px 16px;
      cursor: pointer; position: relative;
      clip-path: inset(0 round var(--r-lg));
      transition: border-color .2s, background .2s, transform .12s, box-shadow .2s;
      user-select: none; -webkit-tap-highlight-color: transparent;
      text-align: center; align-self: start;
    }
    .picker-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      transition: background .3s;
    }
    .picker-card.status-running::before  { background: var(--running); }
    .picker-card.status-boarding::before { background: var(--setup); }   /* legacy */
    .picker-card.status-setup::before    { background: var(--setup); }
    .picker-card.status-idle::before     { background: var(--idle); }
    .picker-card.status-closed::before   { background: var(--closed); }
    .picker-card.status-break::before    { background: var(--break); }
    .picker-card:active { transform: scale(.96); }

    .picker-card.selected {
      border-color: var(--cyan);
      background: rgba(240,180,41,.07);
      box-shadow: 0 0 0 2px rgba(240,180,41,.25), 0 0 28px rgba(240,180,41,.18);
    }
    .picker-card.selected::before { background: var(--cyan) !important; }

    .picker-card.at-max { opacity: .38; pointer-events: none; }
    .picker-card.at-max.selected { opacity: 1; pointer-events: all; }

    .picker-check {
      position: absolute; top: 10px; left: 10px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(240,180,41,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 900; color: #000;
      background: transparent; transition: all .2s;
    }
    .picker-card.selected .picker-check { background: var(--cyan); border-color: var(--cyan); }

    .picker-dot  { width: 12px; height: 12px; border-radius: 50%; margin: 0 auto 12px; }
    .picker-name { font-size: .95rem; font-weight: 800; color: var(--text-100); margin-bottom: 4px; line-height: 1.2;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
    .picker-topic{ font-size: .82rem; font-weight: 600; color: var(--text-300); margin-bottom: 8px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }

    /* ════════════════════════════════
       STEP 2 — DIRECTION PICKER
    ════════════════════════════════ */
    .dir-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px; width: 100%; max-width: 860px;
      flex: 1; overflow-y: auto; align-content: start;
      padding-bottom: 4px;
    }

    .dir-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--glass); border: 2px solid var(--glass-border);
      border-radius: var(--r-lg); padding: 12px 16px;
    }
    .dir-row-info { flex: 1; min-width: 0; }
    .dir-row-name { font-size: 1rem; font-weight: 800; color: var(--text-100); }
    .dir-row-topic{ font-size: .95rem; font-weight: 600; margin-top: 2px; }

    /* 3×3 D-pad */
    .dpad {
      display: grid; grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(3, 36px); gap: 3px; flex-shrink: 0;
    }
    .dpad-btn {
      width: 36px; height: 36px; border-radius: var(--r-sm);
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: var(--text-300); font-size: .9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:hover  { background: rgba(255,255,255,.12); }
    .dpad-btn:active { transform: scale(.9); }
    .dpad-btn.selected {
      background: var(--cyan); border-color: var(--cyan);
      color: #000; font-weight: 900;
      box-shadow: 0 0 12px rgba(240,180,41,.5);
    }
    .dpad-center { /* empty center */ opacity: 0; pointer-events: none; }

    .dir-chosen {
      font-size: 2.4rem; width: 48px; text-align: center; flex-shrink: 0;
      transition: transform .2s;
    }

    /* ════════════════════════════════
       STEP 3 — DISPLAY
    ════════════════════════════════ */
    #display {
      width: 100vw; height: 100dvh;
      display: grid; position: relative;
    }
    #display.hidden { display: none; }

    #display[data-count="1"] { grid-template-columns: 1fr; }
    #display[data-count="2"] { grid-template-columns: 1fr 1fr; }
    #display[data-count="3"] { grid-template-columns: 1fr 1fr 1fr; }
    #display[data-count="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* Back button */
    .disp-back {
      position: fixed; bottom: 16px; right: 16px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.18);
      color: var(--text-300); font-size: .82rem; font-weight: 600;
      padding: 10px 18px; border-radius: 100px; cursor: pointer;
      transition: background .2s, opacity .2s; opacity: .55;
      -webkit-tap-highlight-color: transparent;
    }
    .disp-back:hover { opacity: 1; background: rgba(0,0,0,.9); }

    /* Station cell */
    .disp-cell {
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: clamp(18px,3.5vw,56px) clamp(14px,3.5vw,56px) clamp(14px,3vh,40px);
      text-align: center; position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,.05);
      transition: background .8s ease;
    }
    .disp-cell::before {
      content: ''; position: absolute; inset: 0; z-index: 0;
      transition: background .8s ease; pointer-events: none;
    }
    /* accent top stripe per cell */
    .disp-cell::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 2;
    }
    .disp-cell.status-idle::before     { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(84,110,122,.22) 0%, transparent 68%); }
    .disp-cell.status-boarding::before { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,193,7,.18) 0%, transparent 68%); }   /* legacy */
    .disp-cell.status-running::before  { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(33,150,243,.2) 0%, transparent 68%); }
    .disp-cell.status-setup::before    { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,193,7,.17) 0%, transparent 68%); }
    .disp-cell.status-closed::before   { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(244,67,54,.2) 0%, transparent 68%); }
    .disp-cell.status-break::before    { background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255,152,0,.2) 0%, transparent 68%); }

    .disp-cell.status-idle::after     { background: var(--idle);    }
    .disp-cell.status-boarding::after { background: var(--setup); box-shadow: 0 0 12px var(--setup); }   /* legacy */
    .disp-cell.status-running::after  { background: var(--running); }
    .disp-cell.status-setup::after    { background: var(--setup);   }
    .disp-cell.status-closed::after   { background: var(--closed);  }
    .disp-cell.status-break::after    { background: var(--break);   }

    .disp-cell > * { position: relative; z-index: 1; }

    .disp-cell-top {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .disp-cell-logo  { height: clamp(26px,3.5vw,48px); opacity: .7; }
    .disp-cell-event { font-size: clamp(.5rem,1.1vw,.9rem); color: var(--text-400); letter-spacing: .06em; }

    .disp-cell-main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(8px,1.8vh,22px); width: 100%;
    }

    .disp-name  { font-size: clamp(1.1rem,3.2vw,3rem); font-weight: 900; color: var(--text-100); line-height: 1.1; }
    .disp-topic { font-size: clamp(.7rem,1.8vw,1.7rem); font-weight: 600; }
    .disp-icon  { font-size: clamp(1.8rem,5vw,5.5rem); line-height: 1; }

    .disp-label {
      font-size: clamp(.8rem,2vw,2rem); font-weight: 800; letter-spacing: .05em;
      padding: clamp(5px,1vw,12px) clamp(14px,2.5vw,42px);
      border-radius: 100px; border: 2px solid currentColor;
      box-shadow: 0 0 18px currentColor;
    }
    .disp-label.status-idle     { color: var(--idle);    }
    .disp-label.status-boarding { color: var(--setup); }   /* legacy */
    .disp-label.status-running  { color: var(--running); }
    .disp-label.status-setup    { color: var(--setup);   }
    .disp-label.status-closed   { color: var(--closed);  }
    .disp-label.status-break    { color: var(--break);   }
    /* was pulsing box-shadow to a 68px blur on every boarding cell at once */
    @keyframes pulse-disp {
      0%,100% { opacity: 1;  }
      50%     { opacity: .55; }
    }

    .disp-next {
      /* backdrop-filter: blur() dropped — it is recomputed continuously and is
         a known freeze on low-power Android TV boxes. A more opaque ground
         reads the same over the dark display background. */
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.1); border-radius: var(--r-xl);
      padding: clamp(8px,1.5vw,24px) clamp(14px,2.5vw,48px);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .disp-next-lbl  { font-size: clamp(.55rem,1.1vw,1rem); color: var(--text-300); font-weight: 600; }
    .disp-next-time {
      font-family: var(--font-display); font-size: clamp(1.2rem,3.5vw,4rem);
      font-weight: 900; letter-spacing: 4px; color: var(--text-100);
      text-shadow: 0 0 22px rgba(240,180,41,.5); font-variant-numeric: tabular-nums;
    }
    .disp-next-rel { font-size: clamp(.55rem,1.1vw,1.1rem); color: var(--text-300); }

    .disp-break {
      background: rgba(255,152,0,.1); border: 2px solid rgba(255,152,0,.4);
      border-radius: var(--r-xl); padding: clamp(8px,1.5vw,24px) clamp(16px,3vw,48px);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .disp-break-lbl   { font-size: clamp(.6rem,1.2vw,1.2rem); color: rgba(255,152,0,.8); font-weight: 600; }
    .disp-break-timer {
      font-family: var(--font-display); font-size: clamp(1.6rem,4.5vw,4.5rem);
      font-weight: 900; letter-spacing: 4px; color: #ff9800;
      text-shadow: 0 0 32px rgba(255,152,0,.6); font-variant-numeric: tabular-nums;
    }

    /* Direction arrow at bottom */
    .disp-cell-bottom {
      width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    }
    .disp-clock {
      font-family: var(--font-display); font-size: clamp(.9rem,2.2vw,2.4rem);
      font-weight: 700; color: var(--text-300); letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
    }
    .disp-arrow {
      font-size: clamp(2.8rem,7vw,7rem); line-height: 1;
      color: var(--text-100); filter: drop-shadow(0 0 10px var(--text-400));
      display: inline-block; transition: transform .3s;
    }

    /* Same-topic center notification */
    #center-notif {
      position: fixed; top: 50%; left: 50%;
      /* translateZ + will-change put this on its own compositor layer, so the
         blink varies layer alpha on the GPU instead of repainting the blurred
         shadow every frame — the old version froze weak TV boxes. */
      transform: translate(-50%, -50%) translateZ(0);
      will-change: opacity;
      background: rgba(240,180,41,.96); color: #000;
      border-radius: 12px;
      width: clamp(240px, 36vw, 480px);
      padding: clamp(22px,3.5vw,44px);
      font-size: clamp(.95rem,2vw,1.7rem); font-weight: 800;
      line-height: 1.5; text-align: center;
      z-index: 1000;
      box-shadow: 0 0 60px rgba(240,180,41,.55), 0 8px 32px rgba(0,0,0,.4);
      animation: notif-blink 1s ease-in-out infinite;
      pointer-events: none;
    }
    #center-notif strong { font-weight: 900; display: block; font-size: 1.25em; margin-bottom: .25em; }
    #center-notif.hidden { display: none; }
    #center-notif.left-side { left: clamp(24px,4vw,60px); transform: translateY(-50%) translateZ(0); }
    /* opacity only — animating box-shadow repaints a 60px blur every frame */
    @keyframes notif-blink {
      0%, 100% { opacity: 1;   }
      50%      { opacity: .35; }
    }
    .disp-msg {
      background: rgba(255,193,7,.15); border: 1px solid rgba(255,193,7,.4);
      border-radius: var(--r-md); padding: clamp(5px,.8vw,12px) clamp(8px,1.5vw,22px);
      font-size: clamp(.55rem,1.1vw,1.2rem); font-weight: 700; color: #ffe082;
      max-width: 40%; display: none; text-align: center;
    }
    .disp-msg.visible { display: block; }
  </style>
</head>

<nav class="navbar navbar--autohide" id="auto-navbar">

<!-- ════ STEP 1: SELECT STATIONS ════ -->
<div id="step1" class="step-screen">
  <img src="logo.png" alt="טכנודע" class="step-logo">
  <div class="step-title">הצגה בכניסה למעבדות</div>
  <div class="step-sub">צרו תצוגות לטלוויזיות מעל המעבדות — בחרו עד 4 מתחמים להצגה</div>
  <div class="step-bar">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot"        id="dot2"></div>
  </div>
  <div class="preset-heading" id="preset-heading" style="display:none">⚡ תצוגות מוכנות — לחיצה אחת</div>
  <div class="preset-row" id="preset-row"></div>
  <div class="pick-count" id="pick-count">0 / 4 נבחרו</div>
  <div class="picker-grid" id="picker-grid">
    <div style="grid-column:1/-1"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="step-btns">
    <button class="btn btn--primary" id="btn-next" onclick="goToStep2()" disabled>הבא — בחר כיוונים</button>
  </div>
</div>

<!-- ════ STEP 2: PICK DIRECTIONS ════ -->
<div id="step2" class="step-screen hidden">
  <img src="logo.png" alt="טכנודע" class="step-logo">
  <div class="step-title">כיוון המעבדה</div>
  <div class="step-sub">בחר חץ כיוון לכל מעבדה</div>
  <div class="step-bar">
    <div class="step-dot done"   id="dot1b"></div>
    <div class="step-dot active" id="dot2b"></div>
  </div>
  <div class="dir-list" id="dir-list"></div>
  <div class="step-btns">
    <button class="btn btn--ghost"    onclick="goToStep1()">חזרה לבחירה</button>
    <button class="btn btn--primary"  onclick="showDisplay()">הצג הצגה בכניסה למעבדות</button>
  </div>
</div>

<!-- ════ STEP 3: DISPLAY ════ -->
<div id="display" class="hidden" data-count="1">
  <button class="disp-back" onclick="goToStep1()">← חזרה לבחירה</button>
  <button class="disp-copy" id="disp-copy" onclick="copyCurrentLink()">🔗 העתק קישור לטלוויזיה</button>
</div>
<div id="center-notif" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="js/utils.js?v=20260824e"></script>
<script src="js/theme.js"></script>
<script>
let stations    = {};
let selectedIds = [];           // array, up to 4, ordered
let directions  = {};           // { stationId: 'down' | 'up' | ... }
let inDisplay   = false;
let clockInt    = null;

// ── Direction config ──
// 3×3 grid positions (row,col) → direction key
// Center is empty
const DPAD_LAYOUT = [
  ['up-left',  'up',   'up-right'],
  ['left',     null,   'right'   ],
  ['down-left','down', 'down-right'],
];

const DIR_ARROW = {
  'up':         '▲',
  'up-right':   '▲',
  'right':      '▲',
  'down-right': '▲',
  'down':       '▲',
  'down-left':  '▲',
  'left':       '▲',
  'up-left':    '▲',
};

const DIR_ROTATE = {
  'up':         0,
  'up-right':   315,
  'right':      270,
  'down-right': 225,
  'down':       180,
  'down-left':  135,
  'left':       90,
  'up-left':    45,
};

const DIR_LABEL = {
  'up':         '↑',
  'up-right':   '↖',
  'right':      '←',
  'down-right': '↙',
  'down':       '↓',
  'down-left':  '↘',
  'left':       '→',
  'up-left':    '↗',
};

// ── Preset direction keys ──
// The dpad keys are named for their POSITION in the RTL grid, not for the way
// the arrow points: 'down-left' renders ▲ rotated 135° (so it points down-RIGHT,
// ↘) and 'down-right' renders it rotated 225° (points down-LEFT, ↙). Alias them
// by what the viewer actually sees so presets can't be wired backwards.
const POINTS_DOWN_RIGHT = 'down-left';
const POINTS_DOWN_LEFT  = 'down-right';
const POINTS_DOWN       = 'down';   // a lab shown on its own points at its own entrance

// ── Named preset displays ──
// Edit this list to change what appears on the picker screen. Each entry is
// the lab names exactly as they are set in the station settings. A pair points
// diagonally down-right / down-left; a lab listed on its own points straight
// down at its own entrance.
const PRESET_DEFS = [
  ['מעבדה 1',  'מעבדה 2'],
  ['מעבדה 3',  'מעבדה 4'],
  ['מעבדה 5',  'מעבדה 6'],
  ['יחידה רפואית ב'],
  ['יחידה רפואית א'],
  ['מחשבים 1', 'מחשבים 2'],
  ['אלקטרוניקה', 'טכנולוגיה'],
];

let deepLinkDone = false;

// ── Firebase ──
stationsRef().on('value', snap => {
  stations = {};
  snap.forEach(c => {
    const v = c.val();
    if (v && v.id && v.enabled !== false) stations[v.id] = v;
  });

  // A ?stations=... link opens straight into the display (TV / kiosk mode)
  if (!deepLinkDone && Object.keys(stations).length) {
    deepLinkDone = true;
    if (applyDeepLink()) return;
  }

  if (inDisplay) renderDisplay();
  else { renderPicker(); renderPresets(); }
});

// ════════════════════════════════
// PRESETS + SHARE LINKS
// ════════════════════════════════

// Names are matched loosely — whitespace collapsed and geresh / apostrophe
// variants stripped — so "יחידה רפואית ב'" still matches a lab saved as
// "יחידה רפואית ב". A preset naming a lab that does not exist is skipped.
function normName(n) {
  return (n || '').replace(/['\u2019\u05F3"\u05F4]/g, '').replace(/\s+/g, ' ').trim();
}

function findStationByName(name) {
  const target = normName(name);
  return Object.values(stations).find(s => normName(s.name) === target) || null;
}

function getPresets() {
  const out = [];
  for (const def of PRESET_DEFS) {
    const labs = def.map(findStationByName);
    if (labs.some(s => !s)) continue;

    const dirs = {};
    if (labs.length === 1) {
      dirs[labs[0].id] = POINTS_DOWN;
    } else {
      dirs[labs[0].id] = POINTS_DOWN_RIGHT;
      dirs[labs[1].id] = POINTS_DOWN_LEFT;
    }
    out.push({ ids: labs.map(s => s.id), dirs, labs });
  }
  return out;
}

function buildShareUrl(ids, dirs) {
  const qs = new URLSearchParams({
    stations: ids.join(','),
    dirs:     ids.map(id => dirs[id] || 'down').join(',')
  });
  return location.origin + location.pathname + '?' + qs;
}

function renderPresets() {
  const row  = document.getElementById('preset-row');
  const head = document.getElementById('preset-heading');
  if (!row) return;
  const presets = getPresets();
  head.style.display = presets.length ? '' : 'none';

  row.innerHTML = presets.map((p, i) => {
    const title = p.labs.map(s => s.name).join(' + ');
    const rows  = p.labs.map(s =>
      `<span><span class="pv">${DIR_LABEL[p.dirs[s.id]]}</span> ${s.name}</span>`
    ).join('');
    return `<div class="preset-card" onclick="applyPreset(${i})">
      <div class="preset-title">${title}${p.labs.length === 1 ? ' <span style="font-weight:600;color:var(--text-400);font-size:.78rem">(מסך יחיד)</span>' : ''}</div>
      <div class="preset-labs">${rows}</div>
      <button class="preset-copy" onclick="event.stopPropagation();copyPresetLink(${i})">🔗 העתק קישור</button>
    </div>`;
  }).join('');
}

function applyPreset(i) {
  const p = getPresets()[i];
  if (!p) return;
  selectedIds = [...p.ids];
  directions  = { ...p.dirs };
  showDisplay();
}

function copyPresetLink(i) {
  const p = getPresets()[i];
  if (!p) return;
  copyToClipboard(buildShareUrl(p.ids, p.dirs), 'הקישור הועתק — הדביקו בטלוויזיה');
}

function copyCurrentLink() {
  if (!selectedIds.length) return;
  copyToClipboard(buildShareUrl(selectedIds, directions), 'הקישור הועתק — הדביקו בטלוויזיה');
}

// Reads ?stations=id1,id2&dirs=left,right and opens the display directly.
function applyDeepLink() {
  const ids = (getParam('stations')||'').split(',').map(s => s.trim()).filter(Boolean);
  if (!ids.length) return false;
  const valid = ids.filter(id => stations[id]).slice(0, 4);
  if (!valid.length) return false;

  const dirs = (getParam('dirs')||'').split(',').map(s => s.trim());
  selectedIds = valid;
  directions  = {};
  valid.forEach((id, i) => { directions[id] = DIR_ROTATE[dirs[i]] !== undefined ? dirs[i] : 'down'; });

  showDisplay();
  return true;
}

// ════════════════════════════════
// STEP 1 — PICKER
// ════════════════════════════════
function groupByFloor(list) {
  const order  = ['lower','upper'];
  const labels = { lower:'🏠 קומה תחתונה', upper:'🔝 קומה עליונה' };
  const map    = {};
  list.forEach(s => { const f = s.floor||'upper'; if (!map[f]) map[f]=[]; map[f].push(s); });
  return order.filter(f => map[f]&&map[f].length).map(f => ({ label: labels[f]||f, stations: map[f] }));
}

function renderPicker() {
  const grid  = document.getElementById('picker-grid');
  const list  = Object.values(stations).sort((a,b) => (a.order||0)-(b.order||0));
  const atMax = selectedIds.length >= 4;

  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-400);padding:48px 0;">אין מתחמים פעילים</div>';
    return;
  }

  const groups = groupByFloor(list);
  grid.innerHTML = groups.map(g =>
    `<div class="floor-section-header" style="grid-column:1/-1">${g.label}</div>` +
    g.stations.map(s => {
      const st    = s.status || 'idle';
      const color = s.topicColor || 'var(--cyan)';
      const isSel = selectedIds.includes(s.id);
      const cls   = `picker-card status-${st}${isSel?' selected':''}${atMax&&!isSel?' at-max':''}`;
      return `<div class="${cls}" onclick="togglePick('${s.id}')">
        <div class="picker-check">✓</div>
        <div class="picker-dot" style="background:${color};box-shadow:0 0 8px ${color}80"></div>
        <div class="picker-name">${s.name}</div>
        <div class="picker-topic">${s.topic||'ללא נושא'}</div>
        <span class="badge badge--${st}" style="font-size:.63rem;padding:2px 8px;">${STATUS[st].label}</span>
      </div>`;
    }).join('')
  ).join('');

  document.getElementById('pick-count').textContent = `${selectedIds.length} / 4 נבחרו`;
  document.getElementById('btn-next').disabled = selectedIds.length === 0;
}

function togglePick(id) {
  if (selectedIds.includes(id)) {
    selectedIds = selectedIds.filter(x => x !== id);
    delete directions[id];
  } else {
    if (selectedIds.length >= 4) return;
    selectedIds.push(id);
  }
  renderPicker();
}

// ════════════════════════════════
// STEP 2 — DIRECTION PICKER
// ════════════════════════════════
function goToStep2() {
  if (!selectedIds.length) return;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  renderDirList();
}

function goToStep1() {
  inDisplay = false;
  clearInterval(clockInt);
  history.replaceState(null, '', location.pathname);
  document.getElementById('display').classList.add('hidden');
  document.getElementById('center-notif').classList.add('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
  renderPicker();
  renderPresets();
}

function renderDirList() {
  const list = document.getElementById('dir-list');
  list.innerHTML = selectedIds.map(id => {
    const s     = stations[id];
    if (!s) return '';
    const color = s.topicColor || 'var(--cyan)';
    const chosen = directions[id] || null;
    const arrowHtml = chosen
      ? `<span class="disp-arrow" style="font-size:2rem;transform:rotate(${DIR_ROTATE[chosen]}deg)">${DIR_ARROW[chosen]}</span>`
      : `<span style="font-size:2rem;color:var(--text-400)">—</span>`;

    const dpadHtml = DPAD_LAYOUT.map(row =>
      row.map(dir => dir === null
        ? `<div class="dpad-center"></div>`
        : `<button class="dpad-btn${chosen===dir?' selected':''}" onclick="setDir('${id}','${dir}')" title="${DIR_LABEL[dir]}">${DIR_LABEL[dir]}</button>`
      ).join('')
    ).join('');

    return `<div class="dir-row" id="dirrow-${id}">
      <div class="dir-row-info">
        <div class="dir-row-name" style="border-right:3px solid ${color};padding-right:8px">${s.name}</div>
        <div class="dir-row-topic" style="color:${color}">${s.topic||''}</div>
      </div>
      <div id="dir-chosen-${id}">${arrowHtml}</div>
      <div class="dpad" id="dpad-${id}">${dpadHtml}</div>
    </div>`;
  }).join('');
}

function setDir(id, dir) {
  directions[id] = dir;
  // Update just this row's dpad and chosen arrow
  const dpad   = document.getElementById(`dpad-${id}`);
  const chosen = document.getElementById(`dir-chosen-${id}`);
  if (!dpad || !chosen) return;
  dpad.querySelectorAll('.dpad-btn').forEach(btn => btn.classList.remove('selected'));
  const sel = [...dpad.querySelectorAll('.dpad-btn')].find(b => b.getAttribute('onclick').includes(`'${dir}'`));
  if (sel) sel.classList.add('selected');
  chosen.innerHTML = `<span class="disp-arrow" style="font-size:2rem;transform:rotate(${DIR_ROTATE[dir]}deg)">${DIR_ARROW[dir]}</span>`;
}

// ════════════════════════════════
// STEP 3 — DISPLAY
// ════════════════════════════════
function showDisplay() {
  if (!selectedIds.length) return;
  inDisplay = true;
  // Keep the address bar in sync so the URL itself is the shareable TV link
  history.replaceState(null, '', buildShareUrl(selectedIds, directions));
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.add('hidden');
  const disp = document.getElementById('display');
  disp.classList.remove('hidden');
  disp.setAttribute('data-count', selectedIds.length);
  renderDisplay();
  clearInterval(clockInt);
  clockInt = setInterval(tickDisplay, 1000);
}

function renderDisplay() {
  const disp = document.getElementById('display');
  disp.querySelectorAll('.disp-cell').forEach(el => el.remove());
  disp.setAttribute('data-count', selectedIds.length);

  selectedIds.forEach(id => {
    const cell  = document.createElement('div');
    cell.id     = `cell-${id}`;
    const s     = stations[id];
    const st    = s ? (s.status||'idle') : 'closed';
    cell.className = `disp-cell status-${st}`;
    cell.innerHTML = buildCell(s, id);
    disp.appendChild(cell);
  });
}

function buildCell(s, id) {
  if (!s) return `<div class="disp-cell-main"><p style="color:var(--closed)">מתחם לא נמצא</p></div>`;

  const st    = s.status || 'idle';
  const color = s.topicColor || 'var(--cyan)';
  const now   = Date.now();
  const dir   = directions[id] || null;

  const header = `<div class="disp-name">${s.name}</div>
    <div class="disp-topic" style="color:${color}">${s.topic||''}</div>`;

  const label = `<div class="disp-label status-${st}">${STATUS[st].label}</div>`;

  let mid = '';
  if (st === 'idle') {
    mid = `${header}<div class="disp-icon">⬜</div>${label}`;
  } else if (st === 'running') {
    const nxt = s.nextSessionTime ? `
      <div class="disp-next">
        <div class="disp-next-lbl">הסבב הבא ב-</div>
        <div class="disp-next-time" id="next-${id}">${formatTime(s.nextSessionTime)}</div>
        <div class="disp-next-rel"  id="rel-${id}">${formatTimeUntil(s.nextSessionTime)}</div>
      </div>` : '';
    mid = `${header}<div class="disp-icon">🔵</div>${label}${nxt}`;
  } else if (st === 'setup' || st === 'boarding') {
    // Setup waits for the instructor, so no clock time can be promised here.
    mid = `${header}<div class="disp-icon">🟡</div>${label}
      <div class="disp-next">
        <div class="disp-next-lbl">הפעילות הבאה</div>
        <div class="disp-next-time">תתחיל בקרוב</div>
      </div>`;
  } else if (st === 'break') {
    const secs = s.breakEndTime ? Math.max(0,Math.round((s.breakEndTime-now)/1000)) : 1800;
    mid = `${header}<div class="disp-icon">☕</div>
      <div class="disp-break">
        <div class="disp-break-lbl">נחזור בעוד</div>
        <div class="disp-break-timer" id="brk-${id}">${timerCells(secs)}</div>
      </div>`;
  } else {
    mid = `${header}<div class="disp-icon">🔴</div>${label}`;
  }

  const arrowHtml = dir
    ? `<span class="disp-arrow" style="transform:rotate(${DIR_ROTATE[dir]}deg)">${DIR_ARROW[dir]}</span>`
    : '';

  const msgHtml = s.managerMessage && s.managerMessage.trim()
    ? `<div class="disp-msg visible">📢 ${s.managerMessage}</div>` : '<div></div>';

  return `
    <div class="disp-cell-top">
      <img src="logo.png" alt="טכנודע" class="disp-cell-logo">
      <div class="disp-cell-event">טכנושף</div>
    </div>
    <div class="disp-cell-main">${mid}</div>
    <div class="disp-cell-bottom">
      <div class="disp-clock" id="clk-${id}">${new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div>
      ${msgHtml}
      ${arrowHtml}
    </div>`;
}

let _lastNotifHtml = '';

function checkSameTopicNotifs() {
  const now = Date.now();
  const THREE_MIN = 3 * 60 * 1000;
  const el = document.getElementById('center-notif');
  if (!el) return;

  const seen = new Set();
  const matches = [];
  for (const id of selectedIds) {
    const displayed = stations[id];
    if (!displayed || !displayed.topic) continue;
    Object.values(stations).forEach(other => {
      if (
        !seen.has(other.id) &&
        other.id !== id &&
        !selectedIds.includes(other.id) &&
        other.topic === displayed.topic &&
        other.status === 'running' &&
        other.sessionEndTime &&
        other.sessionEndTime > now &&
        other.sessionEndTime - now < THREE_MIN
      ) {
        seen.add(other.id);
        matches.push(other);
      }
    });
  }

  if (matches.length) {
    const lines = matches.map(s => {
      const secs = Math.ceil((s.sessionEndTime - now) / 1000);
      const timeStr = secs <= 60 ? 'פחות מדקה' : `${Math.ceil(secs / 60)} דקות`;
      return `<strong>מעבדת ${s.name}</strong> מתפנה בעוד ${timeStr}`;
    }).join('<br>');
    // Runs once a second. Re-assigning innerHTML rebuilds the subtree and
    // forces a repaint of the shadow, so only touch it when the text really
    // changed — which is once a minute, not once a second.
    const html = `🔔 ${lines}<br><span style="font-weight:700">עם פעילות זהה — מוזמנים להגיע לשם</span>`;
    if (html !== _lastNotifHtml) {
      el.innerHTML   = html;
      _lastNotifHtml = html;
    }
    el.classList.remove('hidden');
    el.classList.toggle('left-side', selectedIds.length === 1);
  } else {
    el.classList.add('hidden');
  }
}

function tickDisplay() {
  const now = Date.now();
  selectedIds.forEach(id => {
    const s = stations[id];
    if (!s) return;
    const st = s.status || 'idle';
    const clkEl = document.getElementById(`clk-${id}`);
    if (clkEl) clkEl.textContent = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if (st === 'break' && s.breakEndTime) {
      const el = document.getElementById(`brk-${id}`);
      setTimerText(el, Math.max(0,Math.round((s.breakEndTime-now)/1000)));
    }
    if (s.nextSessionTime) {
      const nEl = document.getElementById(`next-${id}`);
      const rEl = document.getElementById(`rel-${id}`);
      if (nEl) nEl.textContent = formatTime(s.nextSessionTime);
      if (rEl) rEl.textContent = formatTimeUntil(s.nextSessionTime);
    }
  });
  checkSameTopicNotifs();
}
</script>
</body>
</html>
